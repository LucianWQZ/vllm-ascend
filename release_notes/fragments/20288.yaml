pr: 20288
entries:
  - category: feature
    text: Added opt-in Model Runner V2 eager Draft KV read windows for static Eagle3, DFlash, DFlash2 and eligible DSpark methods while keeping Target Graph independent.
  - category: bugfix
    text: Restored native symmetric SWA and full KV backing for admitted noncausal DFlash2 drafts. The storage compatibility measure can reduce cache-token capacity at a fixed memory budget, and does not enable Full attention.
  - category: feature
    text: Added a global-first-rank startup warning when an additional MRV2 Draft window narrows certified native SWA groups. Supported settings remain opt-in and are not automatically disabled.
  - category: feature
    text: Added default-off Draft Window Graph entry points with explicit model and topology limits, including experimental static TP2 DFlash2 Graph plumbing that preserves its native SWA and selector semantics. Unqualified combinations remain blocked; ordinary typed DFlash2 eager remains available.
  - category: feature
    text: Reported loaded Draft Full, native SWA, mixed or unknown attention semantics at startup, independently of full KV retention. Unconfirmed extra-window Graph combinations are rejected explicitly.
  - category: feature
    text: Applied model-capacity, actual-request and capture-shape checks to qualified TP4 Eagle3 and eight-layer Full DFlash Graph profiles, including two local requests with DP1 and one local request per DP2 replica. Unsupported shapes and preempted requests remain rejected without an eager fallback.
  - category: bugfix
    text: Preserved independent Eagle first-pass and autoregressive capture buckets with Target SP, and checked continuing chunked prefills against canonical progress after excluding speculative placeholders.
  - category: config
    text: Unified eager and Graph window policy and interval math, removed private single/two-request and diagnostic configuration flags, and separated Graph buffer ownership from experimental recorders. Experimental Graph enablement remains explicit and disabled by default.
