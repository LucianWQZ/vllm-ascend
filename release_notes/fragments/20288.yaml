pr: 20288
entries:
  - category: feature
    text: Added opt-in Model Runner V2 eager Draft KV read windows for static Eagle3, DFlash, DFlash2 and eligible DSpark methods while keeping Target Graph independent.
  - category: bugfix
    text: Restored native symmetric SWA and full KV backing for admitted noncausal DFlash2 drafts. The storage compatibility measure can reduce cache-token capacity at a fixed memory budget, and does not enable Full attention.
  - category: feature
    text: Added a global-first-rank startup warning when an additional MRV2 Draft window narrows certified native SWA groups. Supported settings remain opt-in and are not automatically disabled.
  - category: feature
    text: Added default-off, controlled Draft Window Graph review entry points with explicit checkpoint and topology limits, including experimental static TP2 DFlash2 Graph plumbing that preserves its native SWA and selector semantics. Unqualified combinations remain blocked; ordinary typed DFlash2 eager remains available.
  - category: feature
    text: Reported loaded Draft Full, native SWA, mixed or unknown attention semantics at startup, independently of full KV retention. Unconfirmed extra-window Graph combinations are rejected explicitly.
  - category: feature
    text: Replaced the controlled single-request Eagle Graph review entry's fixed prompt and output whitelist with model-capacity checks for Window OFF and W1024. Checkpoint, topology, actual-row and capture-shape protections remain in effect; device qualification is reported separately.
  - category: bugfix
    text: Replaced the Full8 single-request Graph review's exact prompt/output whitelist with checked model and allocated-capacity bounds for additional Window OFF or W32768 ON. Static TP4/DP1, actual1/padded1/Q8 and preemption/identity protections remain; new lengths require separate qualification and multiple-request failures stay blocked.
  - category: bugfix
    text: Reject unsupported padded Eagle3 Graph consumer descriptors before replay in the explicit single-request review, including Window OFF.
  - category: bugfix
    text: Connected the identified Full8 and Eagle single-request Graph review contracts to ordinary Window OFF startup. Checkpoint, topology, capacity and capture protections still apply; the review flags do not imply device qualification.
  - category: feature
    text: Added an explicit Full8 TP4/DP2 single-request-per-replica Graph review entry, retaining max_num_seqs=1, actual1/padded1/Q8 and the existing idle-replica protocol. Combined-feature device qualification is separate.
  - category: feature
    text: Connected boolean Async, prefix-cache and Target FlashComm settings to the checkpoint-scoped single-request Full8 and Eagle Graph review entries. Existing Graph ownership, resident canonical KV and actual-row/capacity protections remain; combined-feature model execution is qualified separately, without enabling DSA-CP.
  - category: feature
    text: Added a separate default-off Full8 two-request Graph review with exact local active/padded one-or-two banks, independent original request identities and capacity checks. The single-request entry and larger-batch protections remain intact; ordinary two-request device qualification is separate.
